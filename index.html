<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Dhan Mandi Weight Tracker</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1e3a8a;
            --blue-light: #2563eb;
            --bg: #f4f7fc;
            --card: #ffffff;
            --border: #e2e8f0;
            --muted: #64748b;
            --text: #1e293b;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --warning-bg: #fff7ed;
            --warning-border: #f97316;
            --warning-text: #9a3412;
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }

        /* ── Header ── */
        .app-header {
            background: var(--blue);
            color: white;
            padding: 16px 20px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .app-header p {
            font-size: 0.78rem;
            opacity: 0.75;
            margin-top: 2px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            background: var(--blue);
            padding: 0 12px 12px;
            gap: 8px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 8px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .tab.active {
            background: white;
            color: var(--blue);
        }

        /* ── Pages ── */
        .page { display: none; }
        .page.active { display: block; }

        .content {
            padding: 16px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ── Cards ── */
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        /* ── Progress card ── */
        .progress-card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .progress-meta span { color: var(--muted); }
        .progress-meta strong { color: var(--text); }
        .progress-bar-bg {
            height: 22px;
            background: #e2e8f0;
            border-radius: 40px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.78rem;
            font-weight: 700;
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .target-label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* ── Warning ── */
        .warning {
            background: var(--warning-bg);
            border-left: 4px solid var(--warning-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--warning-text);
            display: none;
        }

        /* ── Entry Form ── */
        .form-section {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .form-section h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 500;
            background: #f8fafc;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        input:focus { border-color: var(--blue-light); background: white; }
        input[readonly] { background: #f1f5f9; color: var(--muted); cursor: default; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 20px;
            border: none;
            border-radius: 32px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--blue);
            color: white;
            width: 100%;
        }
        .btn-primary:hover { background: var(--blue-light); }
        .btn-secondary {
            background: #eef2ff;
            color: var(--blue);
            font-size: 0.85rem;
            padding: 10px 16px;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
            width: 100%;
            margin-top: 8px;
        }
        .btn-danger:hover { background: #b91c1c; }
        .btn-del {
            background: var(--danger-light);
            color: var(--danger);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-del:active { background: var(--danger); color: white; }

        /* ── Group Cards ── */
        .group-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .group-header {
            background: #f8fafc;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .group-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .group-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--blue);
        }
        .group-count {
            font-size: 0.78rem;
            background: #dbeafe;
            color: var(--blue);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .group-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .group-stats span {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .group-stats strong { color: var(--text); }

        .entry-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f8fafc;
        }
        .entry-row:last-child { border-bottom: none; }
        .entry-weight {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }
        .entry-sub {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* ── Summary ── */
        .summary-grand {
            background: var(--blue);
            color: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            text-align: center;
        }
        .summary-grand .big-num {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.1;
        }
        .summary-grand .sub {
            font-size: 0.88rem;
            opacity: 0.8;
            margin-top: 4px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .stat-val {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--blue);
        }
        .stat-card .stat-lbl {
            font-size: 0.76rem;
            color: var(--muted);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .summary-group-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .sgc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
        }
        .sgc-name { font-weight: 700; font-size: 0.95rem; color: var(--blue); }
        .sgc-kg { font-weight: 700; font-size: 0.95rem; color: var(--text); }
        .sgc-body {
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
        }
        .sgc-item { text-align: center; }
        .sgc-item .v { font-weight: 700; font-size: 1rem; }
        .sgc-item .l { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

        /* ── Empty state ── */
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }
        .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .empty p { font-size: 0.9rem; }

        /* ── Section title ── */
        .section-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 20px 0 10px;
        }

        @media (min-width: 500px) {
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <h1>🌾 Dhan Mandi Tracker</h1>
    <p>Weight entry & group-wise hisab</p>
</div>

<div class="tabs">
    <div class="tab active" data-page="entry">📝 Entry</div>
    <div class="tab" data-page="summary">🧾 Poora Hisab</div>
</div>

<!-- Entry Page -->
<div id="entryPage" class="page active">
    <div class="content">

        <!-- Progress -->
        <div class="progress-card">
            <div class="progress-meta">
                <span>🎯 Target: <strong><span id="targetDisplay">50</span> Quintal</strong></span>
                <span>📦 Total: <strong><span id="totalWeightDisplay">0</span> kg</strong></span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressFill">0%</div>
            </div>
            <div class="progress-actions">
                <span class="target-label" id="quintalDisplay">0.00 Quintal</span>
                <button class="btn btn-secondary" id="setTargetBtn">🎯 Target badlo</button>
            </div>
            <div class="warning" id="warningMessage"></div>
        </div>

        <!-- Form -->
        <div class="form-section">
            <h3>Naya entry daalo</h3>
            <div class="form-group">
                <label>Current Group</label>
                <input type="text" id="groupDisplay" readonly>
            </div>
            <div class="form-group">
                <label>Machine Weight (kg)</label>
                <input type="number" id="machineWeight" step="0.01" placeholder="e.g. 125.5" inputmode="decimal">
            </div>
            <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">ℹ️ Har entry mein 3 bori automatically add hoti hai</p>
            <button class="btn btn-primary" id="addEntryBtn">➕ Entry Add Karo (3 Bori)</button>
        </div>

        <!-- Entries -->
        <div id="entriesContainer"></div>

        <!-- Reset -->
        <button class="btn btn-danger" id="resetAllBtn">🗑️ Saara Data Reset Karo</button>
        <div style="height:24px;"></div>
    </div>
</div>

<!-- Summary Page -->
<div id="summaryPage" class="page">
    <div class="content" id="summaryContent"></div>
</div>

<script>
    let allEntries = [];
    let targetQuintal = 50;
    let currentGroup = "Group A";
    let groupCounter = 1;

    function loadData() {
        const stored = localStorage.getItem("weightTrackerData");
        if (stored) {
            try {
                const data = JSON.parse(stored);
                allEntries = data.entries || [];
                targetQuintal = data.targetQuintal !== undefined ? data.targetQuintal : 50;
                currentGroup = data.currentGroup || "Group A";
                groupCounter = data.groupCounter || 1;
            } catch(e) {}
        }
        if (allEntries.length > 0) {
            const last = allEntries[allEntries.length - 1];
            if (last && last.group) currentGroup = last.group;
        } else {
            currentGroup = "Group A";
            groupCounter = 1;
        }
        updateGroupDisplay();
    }

    function saveData() {
        localStorage.setItem("weightTrackerData", JSON.stringify({
            entries: allEntries, targetQuintal, currentGroup, groupCounter
        }));
    }

    function updateGroupDisplay() {
        document.getElementById("groupDisplay").value = currentGroup;
    }

    function getNextGroupAfterAdd() {
        const n = allEntries.filter(e => e.group === currentGroup).length;
        if (n >= 10) {
            groupCounter++;
            currentGroup = `Group ${String.fromCharCode(64 + groupCounter)}`;
            updateGroupDisplay();
        }
    }

    function getTotalMachineWeight() {
        return allEntries.reduce((s, e) => s + (e.machine || 0), 0);
    }

    function updateProgressAndWarning() {
        const totalKg = getTotalMachineWeight();
        const targetKg = targetQuintal * 100;
        const pct = totalKg / targetKg * 100;
        const fill = document.getElementById("progressFill");
        const warn = document.getElementById("warningMessage");

        if (pct > 100) {
            fill.style.background = "linear-gradient(90deg,#dc2626,#f97316)";
            fill.style.width = "100%";
            fill.textContent = `${pct.toFixed(1)}%`;
            warn.style.display = "block";
            warn.textContent = `⚠️ Target exceed ho gaya! ${totalKg.toFixed(2)} kg = ${pct.toFixed(1)}% (${(totalKg - targetKg).toFixed(2)} kg zyada)`;
        } else {
            fill.style.background = "linear-gradient(90deg,#1e3a8a,#3b82f6)";
            fill.style.width = `${pct}%`;
            fill.textContent = pct < 5 ? '' : `${pct.toFixed(1)}%`;
            warn.style.display = "none";
        }

        document.getElementById("totalWeightDisplay").textContent = `${totalKg.toFixed(2)}`;
        document.getElementById("quintalDisplay").textContent = `${(totalKg/100).toFixed(2)} Quintal`;
        document.getElementById("targetDisplay").textContent = targetQuintal;
    }

    function renderEntryPage() {
        updateProgressAndWarning();
        const container = document.getElementById("entriesContainer");

        if (allEntries.length === 0) {
            container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Abhi koi entry nahi hai.<br>Pehli entry daalo!</p></div>`;
            return;
        }

        const grouped = {};
        allEntries.forEach(e => {
            if (!grouped[e.group]) grouped[e.group] = [];
            grouped[e.group].push(e);
        });

        let html = `<div class="section-title">Saari Entries</div>`;
        for (const [group, entries] of Object.entries(grouped)) {
            const groupKg = entries.reduce((s, e) => s + e.machine, 0);
            const groupBori = entries.length * 3;
            html += `
            <div class="group-card">
                <div class="group-header">
                    <div class="group-header-top">
                        <span class="group-name">📁 ${group}</span>
                        <span class="group-count">${entries.length}/10</span>
                    </div>
                    <div class="group-stats">
                        <span>Machine: <strong>${groupKg.toFixed(2)} kg</strong></span>
                        <span>Bori: <strong>${groupBori}</strong></span>
                    </div>
                </div>`;
            entries.forEach((entry, i) => {
                html += `
                <div class="entry-row">
                    <div>
                        <div class="entry-weight">⚙️ ${entry.machine.toFixed(2)} kg</div>
                        <div class="entry-sub">3 bori</div>
                    </div>
                    <button class="btn-del" data-id="${entry.id}">🗑️ Hatao</button>
                </div>`;
            });
            html += `</div>`;
        }
        container.innerHTML = html;

        container.querySelectorAll('.btn-del').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.getAttribute('data-id'));
                const entry = allEntries.find(e => e.id === id);
                if (!entry) return;
                if (confirm(`Ye entry delete karo?\n${entry.group}: ${entry.machine.toFixed(2)} kg\n(3 bori hategi)`)) {
                    allEntries = allEntries.filter(e => e.id !== id);
                    if (allEntries.length === 0) {
                        currentGroup = "Group A"; groupCounter = 1; updateGroupDisplay();
                    }
                    saveData(); renderAll();
                }
            });
        });
    }

    function renderSummaryPage() {
        const container = document.getElementById("summaryContent");
        if (allEntries.length === 0) {
            container.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>Koi data nahi hai.<br>Pehle entries daalo.</p></div>`;
            return;
        }

        const grouped = {};
        allEntries.forEach(e => {
            if (!grouped[e.group]) grouped[e.group] = [];
            grouped[e.group].push(e);
        });

        const grandKg = allEntries.reduce((s, e) => s + e.machine, 0);
        const grandBori = allEntries.length * 3;
        const targetKg = targetQuintal * 100;
        const over = grandKg > targetKg;

        let html = `
        <div class="summary-grand">
            <div class="sub" style="margin-bottom:6px">Kul Machine Weight</div>
            <div class="big-num">${grandKg.toFixed(2)} kg</div>
            <div class="sub">${(grandKg/100).toFixed(2)} Quintal${over ? ` · Target se ${(grandKg-targetKg).toFixed(2)} kg zyada ⚠️` : ''}</div>
        </div>
        <div class="summary-grid">
            <div class="stat-card">
                <div class="stat-val">${grandBori}</div>
                <div class="stat-lbl">Total Bori</div>
            </div>
            <div class="stat-card">
                <div class="stat-val">${allEntries.length}</div>
                <div class="stat-lbl">Total Entries</div>
            </div>
            <div class="stat-card">
                <div class="stat-val">${targetQuintal}</div>
                <div class="stat-lbl">Target (Quintal)</div>
            </div>
            <div class="stat-card">
                <div class="stat-val">${Object.keys(grouped).length}</div>
                <div class="stat-lbl">Groups</div>
            </div>
        </div>
        <div class="section-title">Groupwise Breakdown</div>`;

        for (const [group, entries] of Object.entries(grouped)) {
            const gKg = entries.reduce((s, e) => s + e.machine, 0);
            const gBori = entries.length * 3;
            html += `
            <div class="summary-group-card">
                <div class="sgc-header">
                    <span class="sgc-name">📁 ${group}</span>
                    <span class="sgc-kg">${gKg.toFixed(2)} kg</span>
                </div>
                <div class="sgc-body">
                    <div class="sgc-item"><div class="v">${entries.length}</div><div class="l">Entries</div></div>
                    <div class="sgc-item"><div class="v">${gBori}</div><div class="l">Bori</div></div>
                    <div class="sgc-item"><div class="v">${(gKg/100).toFixed(2)}</div><div class="l">Quintal</div></div>
                </div>
            </div>`;
        }

        html += `
        <button class="btn btn-danger" id="resetAllBtnSummary" style="margin-top:4px;">🗑️ Saara Data Reset Karo</button>
        <div style="height:24px;"></div>`;

        container.innerHTML = html;
        document.getElementById("resetAllBtnSummary").addEventListener('click', resetAllData);
    }

    function renderAll() {
        renderEntryPage();
        renderSummaryPage();
        saveData();
    }

    function resetAllData() {
        if (confirm("⚠️ Pakka? Saari entries aur target delete ho jayega.\nYe action wapas nahi ho sakti.")) {
            allEntries = []; targetQuintal = 50; currentGroup = "Group A"; groupCounter = 1;
            updateGroupDisplay(); saveData(); renderAll();
        }
    }

    function addEntry() {
        const val = parseFloat(document.getElementById("machineWeight").value);
        if (!val || val <= 0) { alert("Machine weight daalo (kg)!"); return; }
        allEntries.push({ id: Date.now(), group: currentGroup, machine: val });
        getNextGroupAfterAdd();
        document.getElementById("machineWeight").value = '';
        document.getElementById("machineWeight").focus();
        renderAll();
    }

    function setTarget() {
        const val = prompt("Target weight (Quintal) daalo:", targetQuintal);
        if (val !== null && !isNaN(parseFloat(val)) && parseFloat(val) > 0) {
            targetQuintal = parseFloat(val);
            renderAll();
        }
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            const page = tab.getAttribute("data-page");
            document.getElementById("entryPage").classList.toggle("active", page === "entry");
            document.getElementById("summaryPage").classList.toggle("active", page === "summary");
            if (page === "entry") renderEntryPage(); else renderSummaryPage();
        });
    });

    document.getElementById("addEntryBtn").addEventListener("click", addEntry);
    document.getElementById("setTargetBtn").addEventListener("click", setTarget);
    document.getElementById("resetAllBtn").addEventListener("click", resetAllData);

    // Enter key support
    document.getElementById("machineWeight").addEventListener("keydown", e => {
        if (e.key === "Enter") addEntry();
    });

    loadData();
    renderAll();
</script>
</body>
</html>
